server.port=8080
spring.application.name=api-gateway

# Gateway Routes Configuration

# User Service Routes
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://user-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/users/(?<segment>.*), /api/users/$\{segment}

# Course Service Routes
spring.cloud.gateway.routes[1].id=course-service
spring.cloud.gateway.routes[1].uri=http://course-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/courses/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/courses/(?<segment>.*), /api/courses/$\{segment}

# Order Service Routes
spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=http://order-service:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/orders/(?<segment>.*), /orders/$\{segment}
spring.cloud.gateway.routes[2].filters[1]=RewritePath=/api/orders, /orders

# Forum Service Routes
spring.cloud.gateway.routes[3].id=forum-service
spring.cloud.gateway.routes[3].uri=http://forum-service:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/forum/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/forum/(?<segment>.*), /api/forum/$\{segment}

# Challenge Service Routes
spring.cloud.gateway.routes[4].id=challenge-service
spring.cloud.gateway.routes[4].uri=http://challenge-service:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/challenges/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/api/challenges/(?<segment>.*), /challenges/$\{segment}
spring.cloud.gateway.routes[4].filters[1]=RewritePath=/api/challenges, /challenges

# Challenge Sandbox Routes
spring.cloud.gateway.routes[6].id=challenge-sandbox
spring.cloud.gateway.routes[6].uri=http://challenge-service:8085
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/sandbox/**
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/api/sandbox/(?<segment>.*), /sandbox/$\{segment}
spring.cloud.gateway.routes[6].filters[1]=RewritePath=/api/sandbox, /sandbox

# News Service Routes
spring.cloud.gateway.routes[5].id=news-service
spring.cloud.gateway.routes[5].uri=http://news-service:8086
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/news/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/api/news/(?<segment>.*), /news/$\{segment}
spring.cloud.gateway.routes[5].filters[1]=RewritePath=/api/news, /news

# CORS Configuration - Now handled by CorsConfig.java
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
